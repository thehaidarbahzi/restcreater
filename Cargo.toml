[package]
name = "restcreater"
version = "1.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
cliclack = "0.3.7"
colored = "3.0.0"
console = "0.15.8"
ctrlc = "3.5.1"
include_dir = "0.7.4"
regex = "1.12.2"
reqwest = { version = "0.13.1", features = ["blocking", "json", "native-tls"] }
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.49.0", features = ["full"] }
walkdir = "2.5"
